<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalton Lab · Prévia protegida</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0e24">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300;400;600;700&family=Manrope:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
  .gate { min-height: 100svh; display: flex; align-items: center; padding-block: 48px;
    background: radial-gradient(55% 45% at 82% 22%, rgba(111,191,206,.14), transparent 65%), radial-gradient(40% 40% at 0% 100%, rgba(156,143,203,.12), transparent 60%), var(--ground); }
  .gate-in { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; max-width: 560px; }
  .gate img { height: 13px; width: auto; margin-bottom: 20px; }
  .gate h1 { font-size: clamp(36px, 5vw, 60px); }
  .gate p { margin: 0; font-size: 18px; color: var(--ink-2); }
  .gate form { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; margin-top: 8px; }
  .gate input { flex: 1 1 220px; min-width: 0; font: inherit; font-size: 16px; color: var(--ink-max); background: rgba(10,14,36,.6); border: 1px solid var(--line-2); border-radius: 6px; padding: 14px 16px; }
  .gate input:focus { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .gate button { border: 0; cursor: pointer; font-family: inherit; }
  .gate button[disabled] { opacity: .6; cursor: default; }
  .gate .msg { min-height: 1.6em; font-size: 15px; color: #f0a6a6; }
</style>
</head>
<body>
<main class="gate">
  <div class="wrap">
    <div class="gate-in">
      <img src="img/dalton-lab-wordmark-claro.svg" alt="Dalton Lab">
      <span class="kicker">Prévia protegida</span>
      <h1 class="h-display">Digite a senha para abrir a página.</h1>
      <form id="f" autocomplete="off">
        <label class="sr-only" for="s">Senha</label>
        <input id="s" type="password" placeholder="Senha" autocapitalize="off" autocorrect="off" spellcheck="false" required>
        <button class="btn btn-primary" type="submit">Entrar</button>
      </form>
      <div class="msg" id="m" role="status" aria-live="polite"></div>
    </div>
  </div>
</main>
